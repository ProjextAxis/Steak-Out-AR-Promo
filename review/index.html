<title>Steak Out | How Was Your Visit?</title>
<!--
  FONTS. Bebas Neue (the headings) is served from this site, from the same files
  the lunch AR page uses, so the headings never wait on a font host that a guest
  network blocks. Open Sans (the body text) still comes from Google, but it is
  loaded without holding the page back: the page draws at once in the phone's own
  font and swaps Open Sans in if and when it arrives. Behind a filter that blocks
  Google it simply stays in the phone's font. Nothing else on this page is loaded
  from anywhere but this site.
-->
<link rel="preload" as="font" type="font/woff2" crossorigin href="./fonts/bebas-neue-latin.woff2">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Open+Sans:wght@400;600;700&display=swap" media="print" onload="this.media='all'">
<noscript><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Open+Sans:wght@400;600;700&display=swap"></noscript>
<style>
  @font-face {
    font-family: 'Bebas Neue';
    font-style: normal;
    font-weight: 400;
    font-display: swap;
    src: url('./fonts/bebas-neue-latin.woff2') format('woff2');
    unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA,
      U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193,
      U+2212, U+2215, U+FEFF, U+FFFD;
  }
  @font-face {
    font-family: 'Bebas Neue';
    font-style: normal;
    font-weight: 400;
    font-display: swap;
    src: url('./fonts/bebas-neue-latin-ext.woff2') format('woff2');
    unicode-range: U+0100-02BA, U+02BD-02C5, U+02C7-02CC, U+02CE-02D7, U+02DD-02FF,
      U+0304, U+0308, U+0329, U+1D00-1DBF, U+1E00-1E9F, U+1EF2-1EFF, U+2020,
      U+20A0-20AB, U+20AD-20C0, U+2113, U+2C60-2C7F, U+A720-A7FF;
  }
  :root {
    color-scheme: dark;
    --bg: #0d0d0d;
    --surface: #1a1a1a;
    --surface-2: #252525;
    --line: #2b2e35;
    --text: #ebebeb;
    --muted: #a0a0a0;
    --red: #ba202a;
    --red-dark: #9e1b24;
    --cream: #f5e6c8;
    --gold: #f2c230;
    --head: "Bebas Neue", Impact, "Arial Narrow", sans-serif;
    --body: "Open Sans", system-ui, -apple-system, sans-serif;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; }
  body {
    min-height: 100vh;
    min-height: 100dvh;
    background:
      radial-gradient(120% 60% at 50% -10%, rgba(186, 32, 42, .28), transparent 60%),
      var(--bg);
    color: var(--text);
    font: 16px/1.5 var(--body);
    -webkit-font-smoothing: antialiased;
    display: flex;
    flex-direction: column;
    align-items: center;
  }

  .test-strip {
    width: 100%;
    background: var(--gold);
    color: #1a1400;
    font: 700 12px/1.3 var(--body);
    text-align: center;
    padding: 8px 16px;
    letter-spacing: .02em;
  }
  .test-strip.flash { animation: flash .6s ease 2; }
  @keyframes flash { 50% { background: #fff3b0; } }

  main {
    width: 100%;
    max-width: 440px;
    padding: 28px 16px 24px;
    flex: 1;
    display: flex;
    flex-direction: column;
  }

  header { text-align: center; margin-bottom: 22px; }
  header .badge { width: 210px; max-width: 60%; height: auto; display: block; margin: 0 auto; }
  header img { transition: width .25s ease; }
  body.compact header { margin-bottom: 16px; }
  body.compact header .badge { width: 110px; }
  main { justify-content: center; }

  h1, h2 {
    font-family: var(--head);
    font-weight: 400;
    letter-spacing: .02em;
    line-height: .95;
    margin: 0;
    text-align: center;
  }
  h1 { font-size: 46px; }
  h2 { font-size: 40px; }

  .bar {
    display: inline-block;
    background: var(--red);
    color: #fff;
    font: 400 20px/1 var(--head);
    letter-spacing: .04em;
    padding: 5px 8px 3px;
    margin-top: 12px;
  }
  .center { text-align: center; }

  .screen { display: none; }
  .screen.on { display: block; animation: rise .35s ease both; }
  @keyframes rise { from { opacity: 0; transform: translateY(12px); } }

  /* ---------- rating ---------- */
  .faces {
    display: grid;
    grid-template-columns: repeat(5, 1fr);
    gap: 8px;
    margin: 30px 0 8px;
  }
  .face {
    appearance: none;
    border: 0;
    background: none;
    color: var(--text);
    padding: 0;
    cursor: pointer;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 8px;
    font: 600 12px/1.2 var(--body);
    -webkit-tap-highlight-color: transparent;
  }
  .face .emo {
    width: 100%;
    max-width: 66px;
    aspect-ratio: 1;
    border-radius: 50%;
    background: var(--surface);
    border: 2px solid var(--line);
    display: grid;
    place-items: center;
    font-size: 36px;
    line-height: 1;
    transition: transform .15s ease, border-color .15s ease, background .15s ease;
  }
  .face:hover .emo, .face:focus-visible .emo {
    transform: scale(1.1);
    border-color: var(--red);
    background: var(--surface-2);
  }
  .face:active .emo { transform: scale(.94); }
  .face:focus-visible { outline: none; }
  h1:focus, h2:focus { outline: none; }
  .face .lbl { color: var(--muted); }
  .face:hover .lbl, .face:focus-visible .lbl { color: var(--text); }

  /* ---------- result screens ---------- */
  .mascot {
    display: block;
    height: 210px;
    width: auto;
    margin: 0 auto 14px;
    animation: pop .5s cubic-bezier(.2, 1.4, .4, 1) both;
  }
  @keyframes pop { from { opacity: 0; transform: scale(.7) translateY(20px); } }
  .picked { font-size: 44px; line-height: 1; text-align: center; margin-bottom: 8px; }

  .lead { color: var(--text); text-align: center; margin: 14px 4px 22px; }

  .btn {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 10px;
    width: 100%;
    min-height: 58px;
    border: 0;
    border-radius: 999px;
    background: var(--red);
    color: #fff;
    font: 400 26px/1 var(--head);
    letter-spacing: .04em;
    text-decoration: none;
    cursor: pointer;
    box-shadow: 0 6px 0 var(--red-dark), 0 10px 24px rgba(186, 32, 42, .35);
    transition: transform .1s ease, box-shadow .1s ease, background .15s ease;
    -webkit-tap-highlight-color: transparent;
  }
  .btn:hover { background: #cc2632; }
  .btn:active { transform: translateY(4px); box-shadow: 0 2px 0 var(--red-dark), 0 4px 12px rgba(186, 32, 42, .3); }
  .btn:focus-visible { outline: 3px solid var(--cream); outline-offset: 3px; }
  .btn[disabled] { opacity: .6; cursor: wait; }
  .btn .g {
    width: 26px; height: 26px; border-radius: 50%;
    background: #fff; display: grid; place-items: center; flex: none;
  }

  .note {
    background: var(--surface);
    border: 1px solid var(--line);
    border-left: 4px solid var(--red);
    border-radius: 14px;
    padding: 16px 18px;
    margin: 16px 0 18px;
  }
  .note p { margin: 0; }
  .note .sig {
    margin-top: 10px;
    font: 400 22px/1 var(--head);
    letter-spacing: .04em;
    color: var(--cream);
  }

  form { display: grid; gap: 12px; }
  label { font-weight: 600; font-size: 14px; display: grid; gap: 6px; }
  label .opt { font-weight: 400; color: var(--muted); }
  textarea, input {
    width: 100%;
    background: var(--surface);
    border: 1px solid var(--line);
    border-radius: 12px;
    color: var(--text);
    font: 16px/1.4 var(--body);
    padding: 12px 14px;
  }
  textarea { min-height: 120px; resize: vertical; }
  textarea:focus, input:focus { outline: none; border-color: var(--red); box-shadow: 0 0 0 3px rgba(186, 32, 42, .3); }
  ::placeholder { color: #777; }
  .hp { position: absolute; left: -9999px; width: 1px; height: 1px; overflow: hidden; }

  .err {
    display: none;
    background: rgba(186, 32, 42, .15);
    border: 1px solid var(--red);
    border-radius: 12px;
    padding: 10px 14px;
    font-size: 14px;
  }
  .err.on { display: block; }
  .err a { color: #fff; }


  .back {
    display: block;
    margin: 22px auto 0;
    background: none;
    border: 0;
    color: var(--muted);
    font: 600 14px/1 var(--body);
    cursor: pointer;
    padding: 8px;
  }
  .back:hover { color: var(--text); }

  footer {
    width: 100%;
    max-width: 440px;
    padding: 16px 16px calc(20px + env(safe-area-inset-bottom));
    text-align: center;
    font-size: 12px;
    color: #777;
    border-top: 1px solid #1d1d1d;
  }
  footer a { color: #999; text-decoration: none; }

  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { animation: none !important; transition: none !important; }
  }
</style>
</head>

      came from, their language or time zone, the address of this page.

   2) The message to the owner: POST {COLLECTOR_URL}/feedback, only when
      they press Send. The face, the words, and a name and phone or email
      only if they typed them. A 2xx answer means it is stored; anything
      else shows "That didn't go through". The Collector keeps it 30 days
      and Orbit keeps the copy.

   Each visit is one random id (kept for this tab only) and the ?c=
   placement from the link (receipt, table, ...). Orbit can see the Google
   tap, not whether a review was posted.
   ---------------------------------------------------------- */

const MOODS = {
  1: { mood: "bad",       emoji: "😡", title: "That's not the Steak Out way.",
       note: n => `Hey, it's ${n}, the owner. I'm sorry. That's not how we do things here. Tell me what happened. This comes straight to me, and I'll make it right.` },
  2: { mood: "not-great", emoji: "🙁", title: "Sorry we fell short.",
       note: n => `Hey, it's ${n}, the owner. We didn't hit the mark this time, and I want to know why. Tell me what happened. This comes straight to me.` },
  3: { mood: "ok",        emoji: "😐", title: "Just OK isn't OK with us.",
       note: n => `Hey, it's ${n}, the owner. "OK" isn't what we're going for. What would've made it great? This comes straight to me, and I read every one.` },
};

const $ = id => document.getElementById(id);
const core = window.SteakoutReviewCore || null;

// TEST MODE: nothing is connected yet, so nothing leaves the phone and a
// message only pretends to send. BROKEN: an address is set but cannot be used
// (not https, a typo, or review-core.js did not load); nothing leaves, and a
// message is NOT pretended sent -- the customer is told to call.
const collectorAsked = String(CONFIG.COLLECTOR_URL || "").trim() !== "";
const collector = core ? core.normalizeCollectorBase(CONFIG.COLLECTOR_URL) : "";
const testMode = !CONFIG.GOOGLE_REVIEW_URL || !collectorAsked;
const connected = collectorAsked && collector !== "";
let rating = 0;
let muted = false; // a robot filled the hidden box: nothing more is reported for this visit

/* ---------- the visit: one random id per tab, and the ?c= placement ----------
   sessionStorage on purpose: it dies with the tab. Every accessor is wrapped,
   because Safari private mode THROWS on it instead of returning null.
   Its own keys, not the AR page's: this is a different visit. */
const SESSION_KEY = "steakout.review.session";
const SOURCE_KEY = "steakout.review.source";
const VISIT_KEY = "steakout.review.visit";
const readStore = key => { try { return window.sessionStorage.getItem(key); } catch (e) { return null; } };
const writeStore = (key, value) => { try { window.sessionStorage.setItem(key, value); } catch (e) { /* private mode */ } };

const newSessionId = () => {
  try {
    if (window.crypto && typeof window.crypto.randomUUID === "function") return window.crypto.randomUUID();
  } catch (e) { /* fall through */ }
  return "sx-" + Date.now().toString(36) + "-" + Math.random().toString(36).slice(2, 10);
};
// One random id per message attempt, kept (in the tab) until the message is stored. It lets the Collector
// store a message once when the customer sends it again because the first answer never reached the phone.
const newMessageId = () => {
  try {
    if (window.crypto && typeof window.crypto.randomUUID === "function") return window.crypto.randomUUID();
  } catch (e) { /* fall through */ }
  return "mx-" + Date.now().toString(36) + "-" + Math.random().toString(36).slice(2, 10);
};
const messageIds = core ? core.createMessageIds({ read: readStore, write: writeStore, makeId: newMessageId }) : null;
const isNewVisit = !readStore(SESSION_KEY);
const session = (() => {
  const existing = readStore(SESSION_KEY);
  if (existing) return existing;
  const fresh = newSessionId();
  writeStore(SESSION_KEY, fresh);
  return fresh;
})();
const source = (() => {
  if (!core) return "direct";
  const params = new URLSearchParams(location.search);
  const asked = params.get("c") || params.get("src"); // c is the name on the printed links; src is the old one
  const fromUrl = asked ? core.cleanSource(asked) : "direct";
  if (fromUrl !== "direct") { writeStore(SOURCE_KEY, fromUrl); return fromUrl; }
  return core.cleanSource(readStore(SOURCE_KEY));
})();

const NO_VISIT = {
  visible() {}, screen() {}, current() { return "rate"; }, scroll() {}, rated() { return 0; }, lastRating() { return 0; },
  mark() {}, tap() { return false; }, hover() { return false; }, allow() { return false; }, flushEnd() { return null; }, export() { return {}; }
};
const startedAt = Date.now();
// ms since the page loaded: performance.now() counts from navigation start.
const now = () => (window.performance && typeof window.performance.now === "function" ? window.performance.now() : Date.now() - startedAt);
// A new tab starts from zero. (A reload in the same tab carries the visit on, so the
// last review_end of a visit is always the whole visit.) Time is counted from here, not
// from when the browser started loading the page, so a slow connection is not "time on
// the first screen".
const visit = core ? core.createVisit({ base: isNewVisit ? null : readStore(VISIT_KEY), startT: now(), visible: document.visibilityState !== "hidden" }) : NO_VISIT;

/* ---------- reporting ---------- */
const send = core ? core.createSender({
  base: collector,
  source,
  session,
  now: () => Date.now(),
  beacon: (url, body) => (navigator.sendBeacon ? navigator.sendBeacon(url, body) : false),
  // If the browser cannot queue a beacon, one plain request stands in for it.
  fallback: (url, body) => {
    fetch(url, { method: "POST", headers: { "Content-Type": "text/plain;charset=utf-8" }, body, keepalive: true, mode: "no-cors", credentials: "omit" })
      .catch(() => {});
  },
}) : null;

function track(event, detail = {}) {
  if (muted) return;
  let shaped = null;
  try { shaped = send ? send(event, detail) : null; } catch (e) { /* measurement never breaks the page */ }
  // dataLayer stays the local, inspectable record: exactly what would be (or was) sent.
  try {
    window.dataLayer = window.dataLayer || [];
    window.dataLayer.push({ event, ...(shaped ? shaped.meta : {}), source, session });
  } catch (e) { /* measurement never breaks the page */ }
  if (!collectorAsked && shaped) { try { console.log("[TEST MODE] event:", shaped); } catch (e) { /* no console */ } }
}
// Like track(), but only while this visit is under the per-tab cap for that kind of event.
function emit(event, detail) {
  try { if (!visit.allow(event)) return; } catch (e) { return; }
  track(event, detail);
}

// ---- fill in names, links, phone ----
$("sendBtn").textContent = `Send to ${CONFIG.OWNER_NAME}`;
$("ownerSig").textContent = `— ${CONFIG.OWNER_NAME}`;
$("footPhone").textContent = CONFIG.PHONE;
$("footPhone").href = `tel:${CONFIG.PHONE_TEL}`;
for (const a of [$("googleBtn"), $("googleSmall")]) {
  if (CONFIG.GOOGLE_REVIEW_URL) a.href = CONFIG.GOOGLE_REVIEW_URL;
  else a.addEventListener("click", e => { e.preventDefault(); flashTest(); });
}

// ---- test mode strip ----
if (testMode || !connected) {
  const missing = [];
  if (!CONFIG.GOOGLE_REVIEW_URL) missing.push("Google link not set");
  if (!collectorAsked) missing.push("Collector not connected, messages and trackers are not sent");
  else if (!connected) missing.push("Collector address is not valid, messages and trackers are not sent");
  $("testStrip").textContent = "TEST MODE · " + missing.join(" · ");
  $("testStrip").hidden = false;
}
function flashTest() {
  const s = $("testStrip");
  s.classList.remove("flash"); void s.offsetWidth; s.classList.add("flash");
}

// ---- the arrival: the top of the funnel. Once per tab; a reload keeps the visit going. ----
if (isNewVisit) {
  let visits;
  try {
    // How many times this phone has opened the page: a count and nothing else.
    const before = Number(window.localStorage.getItem("so-review-visits") || 0);
    visits = Math.min(99, (Number.isFinite(before) && before > 0 ? before : 0) + 1);
    window.localStorage.setItem("so-review-visits", String(visits));
  } catch (e) { visits = undefined; }
  if (core) {
    const nav = window.navigator || {};
    const display = window.screen || {};
    let canHover = false;
    try { canHover = Boolean(window.matchMedia && window.matchMedia("(hover: hover)").matches); } catch (e) { /* no hover */ }
    track("review_open", core.openDetail({
      screenW: display.width,
      screenH: display.height,
      dpr: window.devicePixelRatio,
      platform: nav.platform,
      uaPlatform: nav.userAgentData && nav.userAgentData.platform,
      maxTouchPoints: nav.maxTouchPoints,
      hover: canHover,
      visits,
      date: new Date(),
    }));
  }
}
visit.screen("rate", now());
emit("screen_shown", { scr: "rate" });

/* ---------- watching: taps, hovers, how far they scroll, when they leave ----------
   Everything here is wrapped: measuring must never break the page. */
const safely = fn => (...args) => { try { return fn(...args); } catch (e) { return undefined; } };
const flushers = [];
let queueScroll = () => {};

if (core) safely(() => {
  const tapFilter = core.createTapFilter();
  const listen = (target, type, handler, options) => target.addEventListener(type, safely(handler), options);

  const recordTap = event => {
    let { clientX, clientY } = event;
    // A key press on a button is a click with no position. Use the button's middle.
    if (clientX === 0 && clientY === 0 && event.detail === 0 && event.target && event.target.getBoundingClientRect) {
      const rect = event.target.getBoundingClientRect();
      clientX = rect.left + rect.width / 2;
      clientY = rect.top + rect.height / 2;
    }
    const detail = core.tapDetail({
      target: event.target,
      clientX,
      clientY,
      viewW: window.innerWidth,
      viewH: window.innerHeight,
      scrollY: window.scrollY || window.pageYOffset || 0,
      pageH: document.documentElement.scrollHeight,
      t: Math.round(event.timeStamp || now()),
    });
    const mayBeSent = visit.tap();
    if (detail && mayBeSent) track("tap", detail);
  };

  listen(document, "pointerdown", event => {
    if (event.isPrimary) tapFilter.down(event.pointerId, event.clientX, event.clientY, event.timeStamp);
  }, { capture: true, passive: true });
  listen(document, "pointercancel", event => { tapFilter.cancel(event.pointerId); }, { capture: true, passive: true });
  listen(document, "pointerup", event => {
    if (!event.isPrimary || !event.isTrusted) return;
    if (tapFilter.up(event.pointerId, event.clientX, event.clientY, event.timeStamp, event.button)) recordTap(event);
  }, { capture: true, passive: true });
  listen(document, "click", event => {
    if (!event.isTrusted) return;
    if (tapFilter.click(event.timeStamp)) recordTap(event);
  }, { capture: true, passive: true });

  // Hovers: only where a mouse can rest, and only on the things the page tags.
  let canHover = false;
  try { canHover = Boolean(window.matchMedia && window.matchMedia("(hover: hover)").matches); } catch (e) { /* no hover */ }
  if (canHover) {
    const rest = core.createHoverRest();
    const hoverEnded = done => { if (done && visit.hover()) track("hover", done); };
    listen(document, "pointerover", event => {
      if (event.pointerType !== "mouse") return;
      const hit = core.resolveTarget(event.target);
      hoverEnded(rest.move(hit.node, hit.el, now()));
    }, { capture: true, passive: true });
    // The mouse left the window while resting on something.
    listen(document, "pointerout", event => {
      if (event.pointerType === "mouse" && !event.relatedTarget) hoverEnded(rest.move(null, null, now()));
    }, { capture: true, passive: true });
    flushers.push(() => hoverEnded(rest.flush(now())));
  }

  // How far down the page they got (the longest screens scroll on a small phone).
  let scrollQueued = false;
  const measureScroll = () => {
    scrollQueued = false;
    const doc = document.documentElement;
    const pageH = Math.max(doc.scrollHeight, document.body ? document.body.scrollHeight : 0, window.innerHeight);
    const y = window.scrollY || window.pageYOffset || 0;
    visit.scroll(core.pct1(y + window.innerHeight, pageH));
  };
  queueScroll = () => {
    if (scrollQueued) return;
    scrollQueued = true;
    if (typeof window.requestAnimationFrame === "function") window.requestAnimationFrame(safely(measureScroll));
    else measureScroll();
  };
  listen(window, "scroll", queueScroll, { passive: true });
  listen(window, "resize", queueScroll, { passive: true });
  listen(window, "load", queueScroll, { passive: true });
  queueScroll();

  // Leaving: the whole visit, added up, each time the page is hidden.
  const flush = () => {
    const t = now();
    flushers.forEach(fn => safely(fn)());
    const detail = visit.flushEnd(t);
    writeStore(VISIT_KEY, JSON.stringify(visit.export(t)));
    if (detail) track("review_end", detail);
  };
  listen(document, "visibilitychange", () => {
    const t = now();
    if (document.visibilityState === "hidden") { visit.visible(false, t); flush(); }
    else visit.visible(true, t);
  });
  listen(window, "pagehide", () => { visit.visible(false, now()); flush(); });
  // Back/forward can bring a finished page back from the browser's memory.
  listen(window, "pageshow", event => {
    if (event.persisted) visit.visible(document.visibilityState !== "hidden", now());
  });
})();

for (const a of [$("googleBtn"), $("googleSmall")]) a.addEventListener("click", () => {
  // A tap on a link that goes nowhere (no Google link set yet) is not a tap on Google.
  if (!CONFIG.GOOGLE_REVIEW_URL) return;
  visit.mark("g");
  emit("google_tap", { r: rating, btn: a.id === "googleBtn" ? "main" : "footer" });
});
document.addEventListener("click", e => {
  const link = e.target && e.target.closest ? e.target.closest("a") : null;
  if (!link || String(link.getAttribute("href") || "").indexOf("tel:") !== 0) return;
  visit.mark("ph");
  emit("phone_tap", { scr: visit.current() });
});
let startedTyping = false;
$("msg").addEventListener("input", () => {
  if (startedTyping) return;
  startedTyping = true;
  visit.mark("typed");
  emit("message_started", { r: rating });
});

// ---- screens ----
function show(id) {
  document.querySelectorAll(".screen").forEach(s => s.classList.toggle("on", s.id === id));
  document.body.classList.toggle("compact", id !== "rate");
  $("publicLink").hidden = id !== "owner";
  window.scrollTo({ top: 0 });
  const h = $(id + "Title");
  if (h) { h.setAttribute("tabindex", "-1"); h.focus({ preventScroll: true }); }
  visit.screen(id, now());
  emit("screen_shown", { scr: id });
  queueScroll();
}

document.querySelectorAll(".face").forEach(b => b.addEventListener("click", () => {
  rating = Number(b.dataset.rating);
  const before = visit.rated(rating);
  emit("rating_tap", { r: rating, prev: before });
  if (rating >= 4) {
    $("happyBar").textContent = rating === 5 ? "Glad you loved it" : "Glad you enjoyed it";
    show("happy");
  } else {
    const m = MOODS[rating];
    $("ownerEmoji").textContent = m.emoji;
    $("ownerTitle").textContent = m.title;
    $("ownerNote").textContent = m.note(CONFIG.OWNER_NAME);
    $("err").classList.remove("on");
    show("owner");
  }
}));
document.querySelectorAll("[data-back]").forEach(b => b.addEventListener("click", () => {
  emit("answer_changed", { from: rating, scr: visit.current() });
  show("rate");
}));

// ---- send to the owner, through the Collector ----
const failedLine = `That didn't go through. Check your connection and try again, or call us at <a href="tel:${CONFIG.PHONE_TEL}" data-track="phone">${CONFIG.PHONE}</a>.`;
const tooLongLine = `That message is too long to send. Please shorten it a little, or call us at <a href="tel:${CONFIG.PHONE_TEL}" data-track="phone">${CONFIG.PHONE}</a>.`;
let sending = false;

$("ownerForm").addEventListener("submit", async e => {
  e.preventDefault();
  if (sending) return;
  const err = $("err");
  const message = $("msg").value.trim();
  if (!message) {
    err.textContent = "Tell me what happened first.";
    err.classList.add("on");
    $("msg").focus();
    return;
  }
  err.classList.remove("on");

  const payload = {
    rating,
    message,
    name: $("name").value.trim(),
    contact: $("contact").value.trim(),
  };

  // bots fill hidden fields; humans can't see this one. A bot is shown "sent"
  // and nothing goes anywhere, not the message and not another event.
  if ($("website").value) { muted = true; done(payload); return; }

  if (!collectorAsked) {
    console.log("[TEST MODE] would send to the Collector:", payload);
    sentOk(payload);
    return;
  }

  // The same words sent again (the first answer was lost) carry the same id; new words get a new one.
  const messageId = connected && messageIds ? messageIds.idFor(payload) : null;
  const built = connected && core ? core.buildFeedback({ session, source, ...payload, messageId, at: Date.now() }) : { ok: false, reason: "unavailable" };
  if (!built.ok) {
    err.innerHTML = built.reason === "too_long" ? tooLongLine : failedLine;
    err.classList.add("on");
    return;
  }

  const btn = $("sendBtn");
  sending = true;
  btn.disabled = true;
  btn.textContent = "Sending…";
  try {
    const out = await core.postFeedback({
      base: collector,
      body: built.body,
      fetch: (...args) => window.fetch(...args),
      setTimeout: (...args) => window.setTimeout(...args),
      clearTimeout: (...args) => window.clearTimeout(...args),
      AbortController: window.AbortController,
    });
    if (out.ok) {
      if (messageIds) messageIds.stored(); // stored: the next message is a new one
      sentOk(payload);
    } else {
      emit("message_failed", { r: rating, err: out.err });
      err.innerHTML = failedLine;
      err.classList.add("on");
    }
  } finally {
    sending = false;
    btn.disabled = false;
    btn.textContent = `Send to ${CONFIG.OWNER_NAME}`;
  }
});

function sentOk(payload) {
  visit.mark("sent");
  emit("message_sent", {
    r: rating,
    len: payload.message.length,
    nm: payload.name ? 1 : 0,
    ct: payload.contact ? 1 : 0,
  });
  done(payload);
}
function done(payload) {
  $("sentBar").textContent = `${CONFIG.OWNER_NAME} reads every one`;
  $("sentLead").innerHTML = payload.contact
    ? `${esc(CONFIG.OWNER_NAME)} will reach out to you. Need us sooner? Call <a href="tel:${CONFIG.PHONE_TEL}" data-track="phone" style="color:#fff">${CONFIG.PHONE}</a>.`
    : `Thanks for telling us straight. Want a call back? Ring us at <a href="tel:${CONFIG.PHONE_TEL}" data-track="phone" style="color:#fff">${CONFIG.PHONE}</a>.`;
  $("ownerForm").reset();
  show("sent");
}
function esc(s) { return s.replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c])); }
</script>
</body>
</html>
