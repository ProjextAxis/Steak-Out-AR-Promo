name: Import Cheesesteak AR Asset

on:
  push:
    branches: [main]
    paths:
      - '.asset-staging/READY'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  import-asset:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Rebuild GLB and wire live test
        shell: bash
        run: |
          set -euo pipefail
          if [ ! -f .asset-staging/READY ]; then
            echo "No staged asset. Nothing to do."
            exit 0
          fi
          mkdir -p assets
          cat .asset-staging/part-*.b64 | tr -d '\n\r ' | base64 --decode > assets/cheesesteak-special.glb
          test -s assets/cheesesteak-special.glb
          python3 - <<'PY'
          from pathlib import Path
          config = Path('config.js')
          text = config.read_text()
          text = text.replace("itemName: 'Test Burger'", "itemName: 'Cheesesteak Special'")
          text = text.replace("modelUrl: 'https://raw.githubusercontent.com/tommykho/tommykho.github.io/main/assets/models/Burger.glb'", "modelUrl: './assets/cheesesteak-special.glb'")
          text = text.replace('demoAsset: true', 'demoAsset: false')
          config.write_text(text)

          index = Path('index.html')
          text = index.read_text()
          text = text.replace('src="https://raw.githubusercontent.com/tommykho/tommykho.github.io/main/assets/models/Burger.glb"', 'src="./assets/cheesesteak-special.glb"')
          index.write_text(text)
          PY
          rm -rf .asset-staging

      - name: Commit imported asset
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet && git diff --cached --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Add optimized cheesesteak AR model"
          git push
