<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="theme-color" content="#000000" />
<title>Steak Out | $12 Lunch Specials in AR</title>
<link rel="canonical" href="https://lunch.mysteakout.com/preview/" />

<!--
  This was a SECOND copy of the landing page. Its AR was fine -- the iframe
  already pointed at ./preview/marker.html, the canonical build -- but it loaded
  the OLD root app.js, so anyone arriving here got the experience with none of
  the analytics, and it pulled fonts from fonts.googleapis.com and
  fonts.cdnfonts.com that preview/ self-hosts precisely so a filtered guest
  network cannot break the page.

  Two landing pages was survivable while the only url was a long github.io path
  nobody typed. It stopped being survivable the moment the site got
  lunch.mysteakout.com, which is short enough to print and short enough that
  people will type the bare domain.

  THE QUERY STRING IS CARRIED ACROSS ON PURPOSE.
  The flyer encodes ?c=table / ?c=window, and app.js reads `c` off the FIRST url
  it sees and nowhere else. A redirect that dropped the query would make every
  scan report "direct" and silently destroy the whole attribution path.

  location.replace, not assign, so Back returns where they came from instead of
  bouncing through here again. The meta refresh is the no-JS fallback; it cannot
  preserve a query string, which is why the script runs first.
-->
<script>
  (function () {
    try {
      location.replace('./preview/' + location.search + location.hash);
    } catch (error) {
      location.href = './preview/';
    }
  })();
</script>
<meta http-equiv="refresh" content="0; url=./preview/" />

<style>
  html { background: #000; color-scheme: dark }
  body {
    margin: 0; min-height: 100vh;
    display: grid; place-items: center;
    background: #000; color: #fff;
    font: 400 16px/1.5 Arial, Helvetica, sans-serif;
    text-align: center; padding: 24px;
  }
  a { color: #fff }
</style>
</head>
<body>
  <p>Taking you to the Steak Out AR preview&hellip;<br />
  <a href="./preview/">Continue</a></p>
</body>
</html>
